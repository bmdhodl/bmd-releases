name: Release feed CI
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'package*.json', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: feed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-feed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Signature policy refusal cases
        shell: pwsh
        run: ./tests/signature.test.ps1
